<!DOCTYPE html>
<html>
<head>
    <title>HTML and CSS Practice</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        h2 {
            color: green;
        }

        p {
            color: black;
            background-color: white;
            border: 2px solid black;
            padding: 10px;
        }

        .box {
            background-color: lightgreen;
            border: 3px solid green;
            padding: 20px;
            margin: 20px;
        }

        .border1 {
            border: 2px solid red;
        }

        .border2 {
            border: 3px dashed blue;
        }

        .border3 {
            border: 4px dotted purple;
        }

        img {
            width: 300px;
            height: 200px;
            border: 5px solid black;
        }
    </style>
</head>

<body>

    <h1>HTML & CSS Practice</h1>

    <h2>Colors</h2>

    <p>This is a paragraph with text color and background color.</p>

    <h2>Background</h2>

    <div class="box">
        This box has a light green background.
    </div>

    <h2>Borders</h2>

    <p class="border1">Solid Border</p>

    <p class="border2">Dashed Border</p>

    <p class="border3">Dotted Border</p>

    <h2>Images</h2>

    <img src="https://www.w3schools.com/html/img_girl.jpg" alt="Girl">

</body>
</html>
